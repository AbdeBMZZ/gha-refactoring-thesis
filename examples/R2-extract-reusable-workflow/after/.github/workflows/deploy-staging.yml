name: Deploy to staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image-tag: staging-${{ github.sha }}
      replicas: 1
      health-url: https://staging.example.org/health
    secrets:
      deploy-token: ${{ secrets.STAGING_DEPLOY_TOKEN }}
