name: Setup Node project
# Note: a *local* composite action cannot perform the checkout itself, because
# the action's own files only exist on the runner after actions/checkout ran.
description: Install Node.js (with npm cache) and install npm dependencies.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
