name: Docs

on:
  workflow_run:
    workflows: [CI]          # must match the `name:` of ci.yml
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    # Reproduces the old `needs: test` + `if:` condition:
    # only after a *successful* CI run triggered by a *push* on main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # check out the commit CI ran on, not the latest commit of main
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -W -b html docs/ site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
